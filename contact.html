<!DOCTYPE html>
<html>
<head>
  <title>Contact — My Guide Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #f5f5f5; color: #333; line-height: 1.6; }
    header { background: #2d3748; color: white; padding: 20px; text-align: center; }
    nav ul { list-style: none; margin-top: 10px; }
    nav li { display: inline-block; margin: 0 15px; }
    nav a { color: #90cdf4; text-decoration: none; font-weight: 600; }
    nav a:hover { color: #f6e05e; }
    main { max-width: 600px; margin: 30px auto; padding: 0 20px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    h2 { color: #2d3748; text-align: center; margin-bottom: 25px; }
    ul { list-style: none; margin-top: 20px; padding: 0; }
    li { padding: 15px; margin: 10px 0; background: #f7fafc; border-radius: 8px; border-left: 4px solid #2b6cb0; font-size: 1.1em; }
    footer { text-align: center; padding: 20px; color: #718096; margin-top: 30px; }
  </style>
</head>
<body>

<header>
  <h1>📍 My Guide Site</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
     <h1>Get In Touch</h1>
    <p>Have questions or suggestions? Feel free to reach out!</p>

    <form>
        <fieldset>
            <legend>Your details</legend>

            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">— Select a topic —</option>
                    <option value="general">General Inquiry</option>
                    <option value="feedback">Feedback & Suggestions</option>
                    <option value="apply">Apply Those Location</option>
                    <option value="other">Something Else</option>
                </select>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Send message</button>
        </fieldset>
    </form>

</main>

<footer>
  <p>&copy; 2026 My Guide Site — All Rights Reserved</p>
</footer>

</body>
</html>
